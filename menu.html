<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet - Menú Principal</title>

  <!-- BOOTSTRAP -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>

<main class="main-wrapper">
  <div class="wallet-wrapper">

    <!-- ALERTAS DE BOOTSTRAP -->
    <div id="alert-container"></div>

    <!-- TARJETA SALDO -->
    <div class="wallet-card text-center mb-4">
      <p class="mb-1">Saldo disponible</p>
      <h2 id="saldo" class="fw-bold">$0</h2>
    </div>

    <!-- BOTONES -->
    <div class="row g-3">
      <div class="col-12 col-md-4">
        <button id="btnDepositar" class="action-btn w-100">
          <i class="bi bi-plus-circle fs-2"></i>
          <p class="mt-2 mb-0">Depositar</p>
        </button>
      </div>
      <div class="col-12 col-md-4">
        <button id="btnEnviar" class="action-btn w-100">
          <i class="bi bi-send fs-2"></i>
          <p class="mt-2 mb-0">Enviar</p>
        </button>
      </div>
      <div class="col-12 col-md-4">
        <button id="btnMovimientos" class="action-btn w-100">
          <i class="bi bi-clock-history fs-2"></i>
          <p class="mt-2 mb-0">Movimientos</p>
        </button>
      </div>
    </div>

  </div>
</main>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/billetera.js"></script>
</body>
</html>
