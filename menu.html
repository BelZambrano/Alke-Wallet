<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Alke Wallet | Menú</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="app-page">
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="#">
        Alke<span style="color:#22c55e;">Wallet</span>
      </a>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="container mt-5">
    <h2 class="mb-4">Resumen de tu cuenta</h2>

    <!-- MENSAJE JQUERY (consigna) -->
    <div id="menuMessage" class="alert alert-info d-none"></div>

    <div class="row g-4">
      <!-- SALDO -->
      <div class="col-md-6">
        <div class="card p-4">
          <h5 class="text-muted">Saldo disponible</h5>
          <span id="saldo" class="saldo">$ 0</span>
        </div>
      </div>

      <!-- ACCIONES -->
      <div class="col-md-6">
        <div class="card p-4">
          <h5 class="text-muted mb-3">Acciones</h5>

          <div class="d-grid gap-2">
            <button
              class="btn btn-success menu-btn"
              data-target="deposit.html">
              Depositar
            </button>

            <button
              class="btn btn-primary menu-btn"
              data-target="sendmoney.html">
              Enviar dinero
            </button>

            <button
              class="btn btn-outline-primary menu-btn"
              data-target="transactions.html">
              Últimos movimientos
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- SCRIPTS -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
