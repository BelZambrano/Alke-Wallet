<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Alke Wallet | Inicio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="index-page">
  <main class="container d-flex align-items-center justify-content-center vh-100">
    <section class="card p-4 p-md-5 shadow-sm index-card">

      <div class="d-flex align-items-center gap-2 mb-3">
        <svg class="alke-logo" width="40" height="40" viewBox="0 0 48 48" fill="none"
             xmlns="http://www.w3.org/2000/svg" aria-label="Alke Wallet Logo">
          <rect x="2" y="6" width="44" height="36" rx="10" fill="url(#grad)" />
          <rect x="8" y="14" width="32" height="6" rx="3" fill="rgba(255,255,255,0.85)" />
          <circle cx="34" cy="30" r="3" fill="#ffffff" />
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="48" y2="48">
              <stop offset="0%" stop-color="#4f46e5"/>
              <stop offset="100%" stop-color="#22c55e"/>
            </linearGradient>
          </defs>
        </svg>

        <span class="logo-text">Alke<span>Wallet</span></span>
      </div>

      <h2 class="mb-2">Tu billetera digital</h2>
      <p class="text-muted mb-4">
        Administrá tu saldo, realizá depósitos y enviá dinero de forma simple y segura.
      </p>

      <div class="d-grid gap-2">
        <a href="login.html" class="btn btn-primary btn-lg">Comenzar</a>
        <a href="login.html" class="btn btn-outline-primary">Ya tengo cuenta</a>
      </div>

      <p class="text-muted mt-3 mb-0" style="font-size:.85rem;">
        Demo: <b>usuario@alkewallet.com</b> · Clave: <b>123456</b>
      </p>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
