<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet - Login</title>

  <!-- BOOTSTRAP -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- GOOGLE FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/styles.css">

  <style>
    body {
      background: url('img/login-people.jpg') center / cover no-repeat;
      color: #e5e7eb;
    }

    /* Overlay para mejorar contraste */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      z-index: -1;
    }

    .login-card {
      background: rgba(15, 23, 42, 0.85);
      border-radius: 18px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 15px 35px rgba(0,0,0,.35);
    }

    label {
      color: #cbd5e1;
    }
  </style>
</head>

<body>

  <!-- MOBILE FIRST: CENTRADO REAL -->
  <main class="d-flex align-items-center justify-content-center min-vh-100 px-3">

    <div class="login-card">

      <h3 class="text-center mb-4">Inicio de sesión</h3>

      <form id="loginForm">
  <div id="alert-container"></div>

  <label for="email">Correo:</label>
  <input type="email" id="email" >

  <label for="password">Contraseña:</label>
  <input type="password" id="password" >

  <button type="submit">Iniciar Sesión</button>
</form>


    </div>

  </main>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/billetera.js"></script>

</body>
</html>
