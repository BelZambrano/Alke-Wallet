<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Alke Wallet | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="login-page">
  <main class="container d-flex justify-content-center align-items-center vh-100">
    <section class="card shadow p-4 login-card">

      <div class="d-flex justify-content-center align-items-center mb-3 gap-2">
        <svg class="alke-logo" width="42" height="42" viewBox="0 0 48 48" fill="none"
             xmlns="http://www.w3.org/2000/svg" aria-label="Alke Wallet Logo">
          <rect x="2" y="6" width="44" height="36" rx="10" fill="url(#grad)" />
          <rect x="8" y="14" width="32" height="6" rx="3" fill="rgba(255,255,255,0.85)" />
          <circle cx="34" cy="30" r="3" fill="#ffffff" />
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="48" y2="48">
              <stop offset="0%" stop-color="#4f46e5"/>
              <stop offset="100%" stop-color="#22c55e"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="logo-text">Alke<span>Wallet</span></span>
      </div>

      <p class="text-center text-muted mb-4">Ingresá a tu billetera digital</p>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" placeholder="usuario@alkewallet.com" required />
          <div class="invalid-feedback">Ingresá un correo válido</div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" placeholder="123456" required />
          <div class="invalid-feedback">La contraseña es obligatoria</div>
        </div>

        <div id="loginError" class="alert alert-danger d-none">Credenciales incorrectas</div>

        <button type="submit" class="btn btn-primary w-100">Ingresar</button>

        <p class="text-muted text-center mt-3" style="font-size:.85rem;">
          Demo: <b>usuario@alkewallet.com</b> · Clave: <b>123456</b>
        </p>

        <a href="index.html" class="btn btn-link mt-2 w-100">Volver al inicio</a>
      </form>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
