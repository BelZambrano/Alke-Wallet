<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Alke Wallet | Movimientos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="app-page">
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="menu.html">
        Alke<span style="color:#22c55e;">Wallet</span>
      </a>
    </div>
  </nav>

  <main class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="mb-0">Últimos movimientos</h2>
      <a href="menu.html" class="btn btn-outline-primary btn-sm">Volver</a>
    </div>

    <div class="card p-4 mb-3">
      <label for="filterType" class="form-label">Filtrar por tipo</label>
      <select id="filterType" class="form-select">
        <option value="all">Todos</option>
        <option value="deposit">Depósitos</option>
        <option value="send">Envíos</option>
      </select>
    </div>

    <div class="card">
      <ul id="transactionList" class="list-group list-group-flush"></ul>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
