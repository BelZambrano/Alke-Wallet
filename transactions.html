<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallet - Movimientos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="wallet-card">

  <div class="text-center mb-3">
    <i class="bi bi-clock-history fs-2 text-primary"></i>
    <h5 class="mt-1 mb-0">Mi Wallet</h5>
    <small class="text-muted">Saldo disponible</small>
    <h4 class="fw-bold mt-1">
      $ <span id="saldoActual">0</span>
    </h4>
  </div>

  <!-- ALERTAS DE BOOTSTRAP -->
  <div id="alert-container"></div>

  <hr>

  <!-- FILTRO DE TRANSACCIONES -->
  <div class="mb-3">
    <label for="tipoFiltro" class="form-label">Filtrar por tipo:</label>
    <select id="tipoFiltro" class="form-select">
      <option value="todos">Todos</option>
      <option value="Depósito">Depósito</option>
      <option value="Envío">Envío</option>
    </select>
  </div>

  <!-- LISTA DE MOVIMIENTOS -->
  <div id="txList"></div>

  <!-- BOTÓN RESET -->
  <div class="reset-card mt-3">
    <button id="btnReset" class="btn-reset btn btn-outline-danger w-100">
      <i class="bi bi-trash3"></i>
      Limpiar movimientos
    </button>
  </div>

  <hr>

  <a href="menu.html" class="btn btn-outline-secondary w-100">
    <i class="bi bi-house-door me-1"></i>
    Volver al menú
  </a>

</div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/billetera.js"></script>
</body>
</html>
