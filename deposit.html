<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallet - Depositar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body style="background:#0f172a; color:#e5e7eb;">

  <main class="d-flex align-items-center justify-content-center min-vh-100 px-3">
<div class="wallet-card">

  <div class="text-center mb-3">
    <div class="icon-circle">
      <i class="bi bi-wallet2"></i>
    </div>
    <h4 class="mb-1">Depositar</h4>
    <small class="text-muted">Agrega dinero a tu e-wallet</small>
  </div>

  <!-- ALERTAS DE BOOTSTRAP -->
  <div id="alert-container"></div>

  <form id="depositForm">
    <div class="mb-3">
      <label for="depositAmount" class="form-label">
        <i class="bi bi-cash-coin me-1"></i> Monto
      </label>
      <input type="number" class="form-control" id="depositAmount" placeholder="Ej: 10000" min="1" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">
      <i class="bi bi-arrow-down-circle me-1"></i>
      Realizar depósito
    </button>
  </form>

</div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/billetera.js"></script>
</body>
</html>
