<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Alke Wallet | Depositar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="app-page">
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="menu.html">
        Alke<span style="color:#22c55e;">Wallet</span>
      </a>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="container mt-5">
    <h2 class="mb-4">Depositar dinero</h2>

    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4">

          <!-- SALDO ACTUAL (consigna) -->
          <p class="mb-3">
            Saldo actual:
            <strong id="saldoActual">$ 0</strong>
          </p>

          <!-- ALERTA DINÁMICA -->
          <div id="alert-container"></div>

          <!-- FORM -->
          <form id="depositForm" novalidate>
            <div class="mb-3">
              <label for="depositAmount" class="form-label">Monto a depositar</label>
              <input
                type="number"
                id="depositAmount"
                class="form-control"
                placeholder="Ej: 10000"
                min="1"
                required
              />
              <div class="invalid-feedback">
                Ingresá un monto válido
              </div>
            </div>

            <button type="submit" class="btn btn-success w-100">
              Depositar
            </button>
          </form>

          <!-- LEYENDA MONTO DEPOSITADO -->
          <p id="depositInfo"
             class="mt-3 text-success fw-bold d-none">
          </p>

          <a href="menu.html" class="btn btn-link mt-3 w-100">
            Volver al menú
          </a>
        </div>
      </div>
    </div>
  </main>

  <!-- SCRIPTS -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
