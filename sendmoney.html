<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallet - Enviar Dinero</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body style="background:#0f172a; padding:20px;">

  <div class="wallet-card">

  <div class="text-center mb-3">
    <i class="bi bi-send fs-2 text-primary"></i>
    <h4 class="mt-1">Enviar dinero</h4>
    <small class="text-muted">Selecciona un contacto</small>
  </div>

  <!-- ALERTAS DE BOOTSTRAP -->
  <div id="alert-container"></div>

  <form id="sendForm">
    <div class="mb-3">
      <label class="form-label">Contacto</label>
      <select id="contactSelect" class="form-select" required></select>
    </div>
    <div class="mb-3">
      <label class="form-label">Monto</label>
      <input type="number" id="sendAmount" class="form-control" min="1" placeholder="Ej: 5000" required>
    </div>
    <button class="btn btn-primary w-100">Enviar</button>
  </form>
   <!-- BOTÓN PARA AGREGAR CONTACTOS -->
    <button id="btnNuevoContacto" class="btn btn-outline-secondary w-100 mt-2">
      + Agregar contacto
    </button>

     <!-- Botón para volver al menú -->
    <button id="backToMenu" class="btn btn-secondary w-100 mt-2">
      <i class="bi bi-arrow-left-circle me-1"></i> Volver al Menú
    </button>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/billetera.js"></script>

  <script>
    // Redirigir al menú al hacer clic
    $('#backToMenu').click(function() {
      window.location.href = 'menu.html';
    });
  </script>

</body>
</html>
